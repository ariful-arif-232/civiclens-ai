name: Inspect source upload integrity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/bootstrap-restore.yml"]

permissions:
  contents: read

concurrency:
  group: source-upload-diagnostics
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Capture original bytes without executing or changing source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/civiclens-upload-diagnostic
          tar -cf /tmp/civiclens-upload-diagnostic/upload-parts.tar .bootstrap .restore
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          root = pathlib.Path('/tmp/civiclens-upload-diagnostic')
          parts = sorted(pathlib.Path('.bootstrap').glob('source[0-9][0-9]'))
          chunks = [p.read_bytes()[:12000 if n < 13 else 9736] for n, p in enumerate(parts)]
          encoded = b''.join(chunks)
          data = base64.b64decode(encoded, validate=True)
          (root / 'uploaded-source.tar.gz').write_bytes(data)
          lines = ['Diagnostic only: no application code executed and no Git refs changed.']
          lines += [f'{p.name}: {p.stat().st_size} bytes' for p in parts]
          lines += ['Compressed SHA256: ' + hashlib.sha256(data).hexdigest()]
          try:
              uncompressed = gzip.decompress(data)
              lines += [f'Gzip integrity PASS: {len(uncompressed)} bytes']
          except Exception as exc:
              lines += ['Gzip integrity FAIL: ' + str(exc)]
          (root / 'diagnosis.txt').write_text('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: civiclens-upload-diagnostic
          path: /tmp/civiclens-upload-diagnostic/
          retention-days: 1
          if-no-files-found: error
