name: Verified source recovery and checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/bootstrap-restore.yml"]

permissions:
  contents: write

concurrency:
  group: civiclens-source-recovery
  cancel-in-progress: false

jobs:
  recover-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore only after every source checksum matches
        run: python3 .github/scripts/restore_verified_source.py
      - name: Publish recovered source without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CivicLens Recovery"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: recover CivicLens source with verified original file checksums"
          git push origin HEAD:main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and mocked transport tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Local end-to-end demo verification (not real AI)
        run: npm run test:integration
