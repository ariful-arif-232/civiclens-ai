name: Restore CivicLens source

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/bootstrap-restore.yml"
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild and restore application source
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/source.b64
          for n in 00 01 02 03 04 05 06 07 08 09 10 11 12; do
            head -c 12000 ".bootstrap/source${n}" >> /tmp/source.b64
          done
          head -c 9736 .bootstrap/source13 >> /tmp/source.b64
          test "$(wc -c < /tmp/source.b64)" -eq 165736
          base64 -d /tmp/source.b64 > /tmp/source.tar.gz
          tar -tzf /tmp/source.tar.gz >/dev/null
          mkdir -p /tmp/civiclens-source
          tar -xzf /tmp/source.tar.gz -C /tmp/civiclens-source
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/civiclens-source/. .
          rm -rf .bootstrap .restore
          rm -f .github/workflows/bootstrap-restore.yml
      - name: Commit restored source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CivicLens Restore"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: restore CivicLens AI application source"
          git push origin HEAD:main
